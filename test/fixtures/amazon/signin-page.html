<!doctype html>
<html lang="en-in"><head><meta charset="utf-8"><title>Amazon Sign In</title></head>
<body><div class="a-section a-padding-medium auth-workflow"><a href="/" aria-label="Amazon">amazon.in</a>
<form name="signIn" method="post" novalidate action="https://www.amazon.in/ax/claim/validate?arb=TEST" class="auth-validate-form auth-real-time-validation a-spacing-none">
<h1 class="a-spacing-small">Sign in or create account</h1>
<label for="ap_email_login" class="a-form-label">Enter mobile number or email</label>
<input type="email" maxlength="128" id="ap_email_login" autocomplete="username" name="email" class="a-input-text">
<span class="a-button a-button-primary"><input class="a-button-input" type="submit" aria-labelledby="continue-announce"><span id="continue-announce" class="a-button-text">Continue</span></span>
</form></div></body></html>
